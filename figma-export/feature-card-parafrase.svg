<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220" viewBox="0 0 400 220">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;display=swap');
    </style>
  </defs>
  
  <!-- Card Background -->
  <rect width="400" height="220" rx="16" fill="#3b7dd8"/>
  
  <!-- Top Banner -->
  <rect width="400" height="36" rx="16" fill="rgba(0,0,0,0.15)"/>
  <rect y="18" width="400" height="18" fill="rgba(0,0,0,0.15)"/>
  <text x="200" y="23" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="600" fill="rgba(255,255,255,0.9)">Rekomendasi fitur untuk kamu</text>
  
  <!-- Title -->
  <text x="24" y="80" font-family="Plus Jakarta Sans, sans-serif" font-size="20" font-weight="800" fill="white">Fitur Parafrase</text>
  
  <!-- Description -->
  <text x="24" y="108" font-family="Plus Jakarta Sans, sans-serif" font-size="13" fill="rgba(255,255,255,0.8)">
    <tspan x="24" dy="0">Fitur parafrase membantu mengubah</tspan>
    <tspan x="24" dy="18">kalimat menjadi versi baru dengan</tspan>
    <tspan x="24" dy="18">makna yang sama, membuat tulisan</tspan>
    <tspan x="24" dy="18">lebih segar dan mudah dipahami.</tspan>
  </text>
  
  <!-- Image Placeholder -->
  <rect x="280" y="55" width="100" height="100" rx="12" fill="rgba(255,255,255,0.15)"/>
  <text x="330" y="110" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">[Gambar]</text>
  
  <!-- Selected Indicator -->
  <circle cx="380" cy="20" r="12" fill="white" filter="url(#shadow)"/>
  <path d="M374 20L378 24L386 16" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Shadow Filter -->
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>
</svg>