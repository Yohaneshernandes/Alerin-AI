<svg xmlns="http://www.w3.org/2000/svg" width="400" height="120" viewBox="0 0 400 120">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;display=swap');
    </style>
    <linearGradient id="mascotBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe"/>
      <stop offset="100%" style="stop-color:#c7d2fe"/>
    </linearGradient>
  </defs>
  
  <!-- Mascot Circle -->
  <circle cx="45" cy="55" r="36" fill="url(#mascotBg)" stroke="#bfdbfe" stroke-width="2"/>
  <text x="45" y="60" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="24" font-weight="800" fill="#2563eb">A</text>
  
  <!-- Speech Bubble -->
  <rect x="95" y="20" width="290" height="80" rx="20" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <polygon points="90,55 95,45 95,65" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="89" y="46" width="8" height="18" fill="white"/>
  
  <!-- Pre text -->
  <text x="115" y="48" font-family="Plus Jakarta Sans, sans-serif" font-size="15" fill="#1f2937">Pilih </text>
  
  <!-- Bold text -->
  <text x="147" y="48" font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="800" fill="#111827">Jenjang Akademikmu</text>
  
  <!-- Sub text -->
  <text x="115" y="72" font-family="Plus Jakarta Sans, sans-serif" font-size="13" fill="#6b7280">Sesuaikan pilihanmu dengan tingkat</text>
  <text x="115" y="88" font-family="Plus Jakarta Sans, sans-serif" font-size="13" fill="#6b7280">pendidikan yang sedang kamu jalani</text>
</svg>